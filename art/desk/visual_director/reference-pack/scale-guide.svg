<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" role="img" aria-labelledby="title desc">
  <title id="title">RoomScale desk scale schematic</title>
  <desc id="desc">Dimension-derived front silhouette of a 66 by 30 by 30 inch standing desk with one half-inch citizen drawn at exact one-sixtieth height.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#56616a"/>
    </marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #23303a; }
      .muted { fill: #5f6b74; }
      .dim { stroke: #56616a; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide { stroke: #87929a; stroke-width: 1; stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="1300" height="660" rx="18" fill="#f4f6f7"/>
  <text x="58" y="58" font-size="27" font-weight="700">Desk visual target · scale schematic</text>
  <text x="58" y="88" class="muted" font-size="16">Front silhouette, dimension-derived; support positions are illustrative where the source photo is occluded.</text>

  <!-- 12 px per inch: 66 in = 792 px; 30 in = 360 px; citizen = 6 px. -->
  <line x1="286" y1="150" x2="1078" y2="150" stroke="#18252d" stroke-width="7" stroke-linecap="round"/>
  <line x1="286" y1="156" x2="1078" y2="156" stroke="#70848c" stroke-width="2"/>
  <rect x="406" y="166" width="552" height="18" rx="3" fill="#303940"/>
  <rect x="433" y="184" width="42" height="317" rx="5" fill="#343c42"/>
  <rect x="889" y="184" width="42" height="317" rx="5" fill="#343c42"/>
  <rect x="427" y="491" width="54" height="10" rx="3" fill="#182027"/>
  <rect x="883" y="491" width="54" height="10" rx="3" fill="#182027"/>
  <line x1="250" y1="510" x2="1112" y2="510" stroke="#c5ccd0" stroke-width="2"/>

  <line x1="286" y1="582" x2="1078" y2="582" class="dim"/>
  <line x1="286" y1="525" x2="286" y2="590" class="guide"/>
  <line x1="1078" y1="525" x2="1078" y2="590" class="guide"/>
  <rect x="650" y="563" width="65" height="34" rx="8" fill="#f4f6f7"/>
  <text x="682" y="587" text-anchor="middle" font-size="18" font-weight="600">66 in</text>

  <line x1="226" y1="150" x2="226" y2="510" class="dim"/>
  <line x1="240" y1="150" x2="278" y2="150" class="guide"/>
  <line x1="240" y1="510" x2="278" y2="510" class="guide"/>
  <text x="199" y="335" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 199 335)">30 in</text>

  <!-- Citizen height is exactly 6 px: 0.5 in × 12 px/in. -->
  <circle cx="178" cy="504" r="1.5" fill="#202b32"/>
  <path d="M178 506 L178 508.8 M178 507 L176.4 508.2 M178 507 L179.6 508.2 M178 508.8 L176.9 510 M178 508.8 L179.1 510" fill="none" stroke="#202b32" stroke-width="1" stroke-linecap="round"/>
  <line x1="145" y1="501" x2="145" y2="507" class="dim"/>
  <text x="126" y="480" text-anchor="middle" font-size="15" font-weight="600">0.5 in</text>
  <text x="58" y="624" class="muted" font-size="14">The citizen is drawn at 1/60 desk height. Profile and underframe dimensions not visible in the photo remain estimates.</text>

  <rect x="925" y="548" width="318" height="58" rx="10" fill="#e7ecee"/>
  <text x="1084" y="572" text-anchor="middle" font-size="15" font-weight="700">Scale basis</text>
  <text x="1084" y="592" text-anchor="middle" class="muted" font-size="14">66 × 30 × 30 in · RoomDefinition unchanged</text>
</svg>
