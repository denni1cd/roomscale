name: RoomScale quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python quality
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-windows-${{ hashFiles('SETUP_ROOM_SCALE.ps1') }}
      - name: Import production assets
        shell: pwsh
        run: |
          $godot = & ./SETUP_ROOM_SCALE.ps1 | Select-Object -Last 1
          & $godot --headless --editor --path . --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused and startup regressions
        shell: pwsh
        run: ./TEST_ROOM_SCALE.ps1 -Mode Fast
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fast-failure-evidence
          path: verification/stabilization/runs/fast
          if-no-files-found: ignore
